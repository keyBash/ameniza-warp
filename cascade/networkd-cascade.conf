# Ставится в /etc/systemd/networkd.conf.d/10-cascade.conf на оба сервера каскада.
# systemd-networkd по умолчанию при каждом своём запуске (например, когда автообновление
# обновляет systemd) удаляет правила маршрутизации (ip rule) и маршруты, которые создал не он.
# Для каскада это значит: на российском сервере зарубежный трафик уходит напрямую с российского IP,
# на зарубежном - с IP сервера мимо WARP. Эта настройка запрещает networkd трогать чужие правила.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
